<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile — Glamora AR</title>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>
        .profile-page {
            min-height: 100vh;
            padding: 140px 20px 80px;
            background: #fff5f7;
        }

        .profile-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .profile-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 45px;
            box-shadow: 0 25px 70px rgba(164, 73, 98, 0.13);
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fdecef;
            color: #c85f7a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        .profile-title {
            text-align: center;
            font-family: "Playfair Display", serif;
            color: #2b1b20;
            font-size: 34px;
            margin-bottom: 8px;
        }

        .profile-subtitle {
            text-align: center;
            color: #806b72;
            margin-bottom: 35px;
        }

        .profile-info {
            display: grid;
            gap: 18px;
        }

        .profile-field {
            padding: 18px 20px;
            border-radius: 14px;
            background: #fff5f7;
        }

        .profile-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #806b72;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .profile-value {
            color: #2b1b20;
            font-size: 16px;
            font-weight: 600;
        }

        .profile-actions {
            margin-top: 30px;
            display: flex;
            gap: 12px;
        }

        .profile-btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
            font-weight: 700;
        }

        .profile-btn.continue {
            background: #c85f7a;
            color: white;
        }

        .profile-btn.logout {
            background: #fdecef;
            color: #a74360;
        }

        @media (max-width: 600px) {
            .profile-card {
                padding: 30px 20px;
            }

            .profile-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <main class="profile-page">

        <div class="profile-container">

            <div class="profile-card">

                <div class="profile-avatar">
                    👤
                </div>

                <h1 class="profile-title">
                    Welcome, {{ user.name }}
                </h1>

                <p class="profile-subtitle">
                    Your Glamora AR profile
                </p>

                <div class="profile-info">

                    <div class="profile-field">
                        <span class="profile-label">
                            Name
                        </span>

                        <span class="profile-value">
                            {{ user.name }}
                        </span>
                    </div>

                    <div class="profile-field">
                        <span class="profile-label">
                            Email
                        </span>

                        <span class="profile-value">
                            {{ user.email }}
                        </span>
                    </div>

                </div>

                <div class="profile-actions">

                    <a
                        href="{{ url_for('beauty') }}"
                        class="profile-btn continue"
                    >
                        Continue Shopping
                    </a>

                    <a
                        href="{{ url_for('logout') }}"
                        class="profile-btn logout"
                    >
                        Logout
                    </a>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
